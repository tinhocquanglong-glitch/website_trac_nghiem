<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title>Website Trắc nghiệm</title>
    <link rel="icon" href=
            "https://aztest.vn/uploads/news/2019/1_6.jpg"
          type="image/x-icon">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css}">
    <script th:src="@{https://code.jquery.com/jquery-3.5.1.min.js}"></script>
    <script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css}"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="preconnect" th:href="@{https://fonts.googleapis.com}">
    <link rel="preconnect" th:href="@{https://fonts.gstatic.com}" crossorigin>
    <link th:href="@{https://fonts.googleapis.com/css2?family=Poppins&display=swap}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/slick.css}">
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <link href="../static/css/default-page.css" rel="stylesheet" th:href="@{/css/default-page.css}">
    <link rel="stylesheet" th:href="@{/css/listExamSubject.css}">
    <link rel="stylesheet" th:href="@{/css/dropdown.css}">
    <link rel="stylesheet" th:href="@{/css/listClassSubject.css}">
    <link rel="stylesheet" th:href="@{/css/studyProgram.css}">
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css}"
          integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>
<div id="preloader"></div>
<div th:insert="~{default-page :: navbar}"></div>
<div th:replace="~{default-page :: banner}"></div>
<!-- Main Container Start -->
<div class="container-fluid mt-3">
    <div class="row" style="margin: 0 5%">
        <div class="col-md-3">
            <div th:replace="~{default-page :: card-left}"></div>
        </div>
        <div class="col-md-6">
            <div class="container-fluid">
                <div class="row">
                    <div class="mid_card card-block col-sm-12 col-lg-12 mb-2 rounded btn"
                         th:each="chapter, i : ${chapters}">
                        <div class="chapter">
                            <p class="title" th:text="'CHỦ ĐỀ '+${i.index + 1}+'. '+${chapter.chapterName}"></p>
                            <div class="lesson" th:each="lesson, j : ${chapter.lessons}">
                                <a th:href="@{/listExamSubject/__${lesson.id}__}"><p th:text="'Bài '+${j.index + 1}+'. '+${lesson.nameLesson}"></p></a>
                                <div class="small text-primary ml-3" th:if="${lesson.exams != null and !lesson.exams.isEmpty()}">
                                    <span class="d-block font-weight-bold">Bai kiem tra trong bai hoc:</span>
                                    <a class="d-block" th:each="exam : ${lesson.exams}" th:href="@{/quiz1/{id}(id=${exam.id})}">
                                        <i class="fa fa-clipboard-check mr-1"></i><span th:text="${exam.nameExam}">Bai kiem tra</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${chapters.isEmpty()}" class="text-center">
                <span>Chưa có nội dung khung chương trình của môn <span style="text-transform: uppercase;font-weight: bold" th:text="${subject.name}+' ' + ${class.nameClass}"></span></span>
            </div>
            <div class="mt-4" th:if="${studentLessonPlans != null and !studentLessonPlans.isEmpty()}">
                <h5 class="border-bottom pb-2"><i class="fa fa-book-open mr-1"></i>Giáo án công khai</h5>
                <div th:each="plan : ${studentLessonPlans}" class="mb-3">
                    <h6 th:text="${plan.name}">Giáo án</h6>
                    <div th:each="topic : ${plan.planChapters}" class="ml-3 mb-2">
                        <strong th:text="${topic.name}">Chủ đề</strong>
                        <div th:each="lesson : ${topic.lessons}" class="ml-3">
                            <a th:href="@{/listExamSubject/lesson-plan/{id}(id=${lesson.id})}"
                               th:text="${lesson.name}">Bài học</a>
                            <a th:each="exam : ${studentLessonPlanExams[lesson.id]}"
                               class="d-block small text-primary"
                               th:href="@{/quiz1/{id}(id=${exam.id})}">
                                <i class="fa fa-clipboard-check mr-1"></i><span th:text="${exam.nameExam}">Bài kiểm tra</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div th:replace="~{default-page :: card-right}"></div>
        </div>
    </div>
</div>
<div th:replace="~{default-page :: news}"></div>
<!-- Footer -->
<div th:replace="~{default-page :: footer}"></div>
<!-- Footer -->

<!-- Bootstrap JS -->
<script type="text/javascript" th:src="@{//code.jquery.com/jquery-1.11.0.min.js}"></script>
<script type="text/javascript" th:src="@{//code.jquery.com/jquery-migrate-1.2.1.min.js}"></script>
<script type="text/javascript" th:src="@{//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js}"></script>
<script th:src="@{https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js}"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js}"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
<script type="module" th:src="@{https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js}"></script>
<script nomodule th:src="@{https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js}"></script>
<script th:src="@{/js/loader.js}"></script>
<script th:src="@{/js/slider.js}"></script>
</body>
</html>
