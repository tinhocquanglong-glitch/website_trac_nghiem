<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${plan.name}">Chi tiết giáo án</title>
    <link th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/vendors/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
    <link th:href="@{/build/css/custom.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
    <style>
        html, body { min-height: 100%; }
        body { background: #f7f7f7; }
        .main_container { min-height: 100vh; }
        .left_col { z-index: 1000 !important; }
        .top_nav { position: relative; z-index: 1001; }
        main.right_col { min-height: calc(100vh - 70px); position: relative; z-index: 1; overflow: visible; }
        .detail-shell { width: 100%; max-width: 1080px; margin: 0 auto; }
        .detail-hero { background: linear-gradient(135deg, #173042, #287f8d); color: white; border-radius: 14px; padding: 30px; }
        .meta-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .meta-item { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 8px; padding: 9px 12px; font-size: 13px; }
        .content-panel { border: 1px solid #dbe6eb; border-radius: 12px; background: white; box-shadow: 0 8px 24px rgba(23, 48, 66, .07); }
        .chapter-block { border-left: 3px solid #287f8d; padding: 2px 0 4px 18px; }
        .chapter-block + .chapter-block { margin-top: 22px; }
        .lesson-item { display: flex; align-items: center; gap: 10px; border-top: 1px solid #edf2f4; padding: 11px 0 4px; color: #53636f; }
        .lesson-content { white-space: pre-line; }
        .visibility-public { color: #b8f0d7; }
        .visibility-private { color: #ffe0a6; }
    </style>
</head>
<body class="nav-md">
<div class="container body"><div class="main_container">
    <div th:insert="~{index.html :: navbarAdmin}"></div>
    <div th:insert="~{index.html :: topnavAdmin}"></div>
    <main class="right_col" role="main">
        <div class="container-fluid py-4 detail-shell">
            <a th:href="@{/lesson-plans}" class="btn btn-link pl-0 mb-3"><i class="fas fa-arrow-left mr-1"></i> Danh sách giáo án</a>
            <section class="detail-hero mb-4">
                <div class="d-flex justify-content-between align-items-start flex-wrap">
                    <div class="mr-3">
                        <div class="small text-uppercase font-weight-bold text-white-50 mb-2">Giáo án</div>
                        <h1 class="h2 mb-2" th:text="${plan.name}">Tên giáo án</h1>
                        <p class="mb-0" th:text="${plan.description != null and !plan.description.isEmpty() ? plan.description : 'Chưa có mô tả'}">Mô tả</p>
                    </div>
                    <div class="text-right mt-2">
                        <div th:if="${plan.isPublic}" class="visibility-public small"><i class="fas fa-globe mr-1"></i> Public</div>
                        <div th:unless="${plan.isPublic}" class="visibility-private small"><i class="fas fa-lock mr-1"></i> Private</div>
                        <div class="mt-3">
                            <a th:href="@{/lesson-plans/{id}/export(id=${plan.id})}" class="btn btn-outline-light btn-sm mr-2"><i class="fas fa-file-word mr-1"></i> Xuất Word</a>
                            <a th:if="${canEdit}" th:href="@{/lesson-plans/{id}/edit(id=${plan.id})}" class="btn btn-light btn-sm"><i class="fas fa-edit mr-1"></i> Sửa giáo án</a>
                        </div>
                    </div>
                </div>
                <div class="meta-strip">
                    <span class="meta-item"><i class="fas fa-user mr-1"></i><span th:text="${plan.owner.fullName}">Người tạo</span></span>
                    <span class="meta-item" th:if="${plan.subject != null}"><i class="fas fa-book mr-1"></i><span th:text="${plan.subject.name}">Môn học</span></span>
                    <span class="meta-item" th:if="${plan.grade != null}"><i class="fas fa-layer-group mr-1"></i><span th:text="${plan.grade.displayName}">Khối</span></span>
                    <span class="meta-item" th:if="${plan.targetClass != null}"><i class="fas fa-users mr-1"></i><span th:text="${plan.targetClass.className}">Lớp</span></span>
                    <span class="meta-item" th:unless="${plan.targetClass != null}"><i class="fas fa-layer-group mr-1"></i>Cả khối</span>
                </div>
            </section>

            <section class="content-panel p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div><div class="text-uppercase small font-weight-bold text-muted">Lộ trình nội dung</div><h2 class="h4 mb-0">Chủ đề và bài học</h2></div>
                    <span class="badge badge-light" th:text="${plan.planChapters.size() + ' chủ đề'}">0 chủ đề</span>
                </div>
                <div th:if="${plan.planChapters.isEmpty()}" class="text-center text-muted py-5">
                    <i class="fas fa-layer-group fa-2x mb-3"></i>
                    <p class="mb-0">Giáo án chưa có chủ đề và bài học.</p>
                </div>
                <div th:each="chapter, chapterStatus : ${plan.planChapters}" class="chapter-block">
                    <h3 class="h5 mb-3"><span class="text-primary mr-2" th:text="${chapterStatus.index + 1 + '.'}">1.</span><span th:text="${chapter.name}">Tên chủ đề</span></h3>
                    <div th:if="${chapter.lessons.isEmpty()}" class="text-muted small mb-2">Chưa có bài học trong chủ đề này.</div>
                    <div th:each="lesson, lessonStatus : ${chapter.lessons}" class="lesson-item">
                        <span class="badge badge-light" th:text="${chapterStatus.index + 1 + '.' + (lessonStatus.index + 1)}">1.1</span>
                        <div class="flex-grow-1">
                            <div class="font-weight-bold" th:text="${lesson.name}">Tên bài học</div>
                            <div class="small mt-1 lesson-content" th:if="${lesson.content != null}" th:utext="${lesson.content}"></div>
                            <a class="small" th:if="${lesson.attachmentOriginalName != null}" th:href="@{/lesson-plans/lesson/{lessonId}/attachment(lessonId=${lesson.id})}">
                                <i class="fas fa-file-word mr-1"></i><span th:text="${lesson.attachmentOriginalName}">Tải file Word</span>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div th:insert="~{index.html :: footerAdmin}"></div>
</div></div>
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/build/js/custom.min.js}"></script>
</body>
</html>
