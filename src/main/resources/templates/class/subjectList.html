<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png">
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css"
          href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:400,700|Material+Icons"/>
    <title>Website Trắc nghiệm</title>
    <link rel="icon" href=
            "https://aztest.vn/uploads/news/2019/1_6.jpg"
          type="image/x-icon">
    <!-- Bootstrap -->
    <link th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Font Awesome -->
    <link th:href="@{/vendors/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
    <!-- NProgress -->
    <link th:href="@{/vendors/nprogress/nprogress.css}" rel="stylesheet">
    <!-- iCheck -->
    <link th:href="@{/vendors/iCheck/skins/flat/green.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">

    <!-- bootstrap-progressbar -->
    <link th:href="@{/vendors/bootstrap-progressbar/css/bootstrap-progressbar-3.3.4.min.css}" rel="stylesheet">
    <!-- JQVMap -->
    <link th:href="@{/vendors/jqvmap/dist/jqvmap.min.css}" rel="stylesheet"/>
    <!-- bootstrap-daterangepicker -->
    <link th:href="@{/vendors/bootstrap-daterangepicker/daterangepicker.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
    <link rel="stylesheet" th:href="@{/css/curriculum.css}">


    <!-- Custom Theme Style -->
    <link th:href="@{/build/css/custom.min.css}" rel="stylesheet">
    <style>
        table tbody tr td {
            vertical-align: middle !important;
        }

        .gap-10 {
            gap: 10px;
        }
    </style>
</head>
<body class="nav-md">
<div id="preloader"></div>
<div class="container body">
    <div class="main_container">
        <div th:insert="~{index.html :: navbarAdmin}"></div>
        <div th:insert="~{index.html :: topnavAdmin}"></div>
        <div class="right_col curriculum-page" role="main">
            <div class="row">
                <div class="container curriculum-shell">
                    <div class="curriculum-breadcrumb">
                        <a href="/class/list">Khung chương trình</a><span>/</span>
                        <span class="current" th:text="${class.displayName}"></span>
                    </div>
                    <div class="curriculum-header">
                        <div>
                            <div class="curriculum-kicker">Khối học</div>
                            <h1 class="curriculum-title" th:text="${class.displayName}">Danh sách môn học</h1>
                            <p class="curriculum-subtitle">Các môn học và chủ đề thuộc khối này.</p>
                        </div>
                    </div>
                    <div class="alert alert-primary alert-dismissible fade show" role="alert"
                         th:if="${message != null}">
                        <strong th:text="${message}"></strong>
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <div class="curriculum-toolbar">
                        <p class="curriculum-toolbar-label"><i class="fas fa-book-open mr-2"></i>Danh mục môn học của khối</p>
                        <a sec:authorize="hasAnyRole('ADMIN', 'SCHOOL_ADMIN')"
                           th:href="@{/subject/class/create/__${class.id}__}" class="btn btn-primary">
                            <i class="fas fa-plus mr-1"></i>Thêm môn học
                        </a>
                    </div>
                    <div class="curriculum-stats">
                        <div class="curriculum-stat">
                            <strong th:text="${subjects.totalElements}">0</strong>
                            <span>môn học</span>
                        </div>
                        <div class="curriculum-stat">
                            <strong><i class="fas fa-list"></i></strong>
                            <span>mỗi môn có các chủ đề riêng</span>
                        </div>
                    </div>
                    <div class="curriculum-table-wrap">
                    <table class="table curriculum-table">
                        <thead>
                        <tr>
                            <th class="index-cell">STT</th>
                            <th>Hình ảnh</th>
                            <th>Tên môn học</th>
                            <th class="text-center">Số chủ đề</th>
                            <th class="curriculum-actions">Xem / quản trị</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${subjects.isEmpty()}">
                            <td colspan="5" class="curriculum-empty"><i class="fas fa-book"></i>Chưa có môn học cho khối này.</td>
                        </tr>
                        <tr th:each="subject, i :${subjects}">
                            <td class="index-cell" th:text="${i.count}"></td>
                            <td>
                                <img class="curriculum-thumb" th:src="@{${subject.subject.image}}" alt="Ảnh môn học">
                            </td>
                            <td class="name-cell" th:text="${subject.subject.name}"></td>
                            <td class="text-center" th:text="${subject.chapters.size() +' chủ đề'}"></td>
                            <td class="curriculum-actions">
                                <a class="curriculum-icon-button text-primary" th:href="@{/chapter/list/__${subject.id}__}"
                                   title="Xem chủ đề" aria-label="Xem chủ đề"><i class="fas fa-arrow-right"></i></a>
                                <a sec:authorize="hasAnyRole('ADMIN', 'SCHOOL_ADMIN')" class="curriculum-icon-button text-danger"
                                   id="deleteButton" th:href="@{/subject/class/__${class.id}__/__${subject.subject.id}__}"
                                   title="Xóa môn khỏi khối" aria-label="Xóa môn khỏi khối"><i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center mb-100">
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li class="page-item">
                            <a class="page-link" th:href="@{'/subject/list/{id}'(id=(${class.id}),page=${subjects.number - 1})}"
                               th:if="${subjects.hasPrevious()}" aria-label="Previous">
                                <span aria-hidden="true">Trước</span>
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" th:text="${subjects.number}" th:if="${subjects.hasPrevious()}"
                               th:href="@{'/subject/list/{id}'(id=(${class.id}),page=${subjects.number - 1})}">
                            </a>
                        </li>
                        <li class="page-item active">
                            <a class="page-link" th:text="${subjects.number + 1}"
                               th:href="@{'/subject/list/{id}'(id=(${class.id}),page=${subjects.number})}">
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" th:text="${subjects.number + 2}" th:if="${subjects.hasNext()}"
                               th:href="@{'/subject/list/{id}'(id=(${class.id}),page=${subjects.number + 1})}">
                            </a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" th:href="@{'/subject/list/{id}'(id=(${class.id}),page=${subjects.number + 1})}"
                               th:if="${subjects.hasNext()}" aria-label="Next">
                                <span aria-hidden="true">Sau</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <div th:insert="~{index.html :: footerAdmin}"></div>
    </div>
</div>


<div class="modal fade" tabindex="-1" role="dialog" id="deleteModal" sec:authorize="hasAnyRole('ADMIN', 'SCHOOL_ADMIN')">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header bg-info">
                <h5 class="modal-title">Xác nhận xóa</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p th:text="'Bạn có muốn xoá môn học này trong chương trình học '+${class.displayName} +' không ?'"><a></a></p>
            </div>
            <div class="modal-footer">
                <a href="" type="button" class="btn btn-primary" id="delRef">Có</a>
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Không</button>
            </div>
        </div>
    </div>
</div>
<!-- jQuery -->
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<!-- Bootstrap -->
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<!-- FastClick -->
<script th:src="@{/vendors/fastclick/lib/fastclick.js}"></script>
<!-- NProgress -->
<script th:src="@{/vendors/nprogress/nprogress.js}"></script>
<!-- Chart.js -->
<script th:src="@{/vendors/Chart.js/dist/Chart.min.js}"></script>
<!-- gauge.js -->
<script th:src="@{/vendors/gauge.js/dist/gauge.min.js}"></script>
<!-- bootstrap-progressbar -->
<script th:src="@{/vendors/bootstrap-progressbar/bootstrap-progressbar.min.js}"></script>
<!-- iCheck -->
<script th:src="@{/vendors/iCheck/icheck.min.js}"></script>
<!-- Skycons -->
<script th:src="@{/vendors/skycons/skycons.js}"></script>
<!-- Flot -->
<script th:src="@{/vendors/Flot/jquery.flot.js}"></script>
<script th:src="@{/vendors/Flot/jquery.flot.pie.js}"></script>
<script th:src="@{/vendors/Flot/jquery.flot.time.js}"></script>
<script th:src="@{/vendors/Flot/jquery.flot.stack.js}"></script>
<script th:src="@{/vendors/Flot/jquery.flot.resize.js}"></script>
<!-- Flot plugins -->
<script th:src="@{/vendors/flot.orderbars/js/jquery.flot.orderBars.js}"></script>
<script th:src="@{/vendors/flot-spline/js/jquery.flot.spline.min.js}"></script>
<script th:src="@{/vendors/flot.curvedlines/curvedLines.js}"></script>
<!-- DateJS -->
<script th:src="@{/vendors/DateJS/build/date.js}"></script>
<!-- JQVMap -->
<script th:src="@{/vendors/jqvmap/dist/jquery.vmap.js}"></script>
<script th:src="@{/vendors/jqvmap/dist/maps/jquery.vmap.world.js}"></script>
<script th:src="@{/vendors/jqvmap/examples/js/jquery.vmap.sampledata.js}"></script>
<!-- bootstrap-daterangepicker -->
<script th:src="@{/vendors/moment/min/moment.min.js}"></script>
<script th:src="@{/vendors/bootstrap-daterangepicker/daterangepicker.js}"></script>

<!-- Custom Theme Scripts -->
<script th:src="@{/build/js/custom.min.js}"></script>

<script th:src="@{/js/loader.js}"></script>
<script>
    $(document).ready(function () {
        $(".table #deleteButton").on('click', function (event) {
            event.preventDefault();
            var href = $(this).attr('href');
            $('#deleteModal #delRef').attr('href', href);
            $('#deleteModal').modal();
        })
    })

    $("#showExam").click(function () {
        $("#question").toggle();
    });
</script>
</body>
</html>
