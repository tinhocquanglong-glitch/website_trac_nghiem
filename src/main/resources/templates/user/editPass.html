<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cấp lại mật khẩu - Website Trắc nghiệm</title>
    <link rel="icon" href="https://aztest.vn/uploads/news/2019/1_6.jpg" type="image/x-icon">
    <!-- Bootstrap -->
    <link th:href="@{/vendors/bootstrap/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Font Awesome -->
    <link th:href="@{/vendors/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
          integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">
    <!-- Custom Theme Style -->
    <link th:href="@{/build/css/custom.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/loader.css}">
</head>
<body class="nav-md">
<div id="preloader"></div>
<div class="container body">
    <div class="main_container">
        <div th:insert="~{index.html :: navbarAdmin}"></div>
        <div th:insert="~{index.html :: topnavAdmin}"></div>
        <div class="right_col" role="main">
            <div class="container" style="max-width: 620px; padding-top: 25px;">
                <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
                    <i class="fas fa-exclamation-circle mr-1"></i><strong th:text="${error}"></strong>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${message}">
                    <i class="fas fa-check-circle mr-1"></i><strong th:text="${message}"></strong>
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="card shadow-sm border-0" style="border-radius: 12px; overflow: hidden;">
                    <div class="p-3 text-white" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                        <h5 class="m-0 font-weight-bold">
                            <i class="fas fa-key mr-2"></i>Cấp lại mật khẩu người dùng
                        </h5>
                    </div>

                    <div class="p-4 bg-white">
                        <div class="p-3 mb-4 rounded" style="background: #fffbeb; border: 1px solid #fde68a;">
                            <div class="d-flex align-items-center">
                                <div style="width: 44px; height: 44px; border-radius: 50%; background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-right: 14px;">
                                    <i class="fas fa-user-shield"></i>
                                </div>
                                <div>
                                    <div class="text-muted small">Tài khoản được cấp lại:</div>
                                    <strong class="text-dark" style="font-size: 1.05rem;" th:text="${user.fullName}"></strong>
                                    <span class="text-muted ml-1" th:text="'(@' + ${user.id} + ')'"></span>
                                    <div class="small text-muted mt-1" th:if="${user.school != null}">
                                        <i class="fas fa-school mr-1"></i><span th:text="${user.school.name}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <form th:action="@{/user/updatePass}" method="post" id="editPassForm">
                            <input type="hidden" name="id" th:value="${user.id}">
                            <input type="hidden" name="returnUrl" th:value="${backUrl}">

                            <div class="form-group">
                                <label class="font-weight-bold small text-secondary">
                                    Mật khẩu mới <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="newPass" name="newPassword"
                                           required minlength="6" placeholder="Tối thiểu 6 ký tự...">
                                    <div class="input-group-append">
                                        <button class="btn btn-outline-secondary" type="button" id="togglePassBtn">
                                            <i class="fas fa-eye" id="togglePassIcon"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="font-weight-bold small text-secondary">
                                    Xác nhận mật khẩu mới <span class="text-danger">*</span>
                                </label>
                                <input type="password" class="form-control" id="confirmPass" name="confirmPassword"
                                       required minlength="6" placeholder="Nhập lại mật khẩu mới...">
                            </div>

                            <div class="d-flex align-items-center justify-content-between mb-4">
                                <button type="button" class="btn btn-sm btn-outline-warning text-dark font-weight-bold" id="btnQuickDefaultPass">
                                    <i class="fas fa-magic mr-1 text-warning"></i>Đặt nhanh: <code>123456</code>
                                </button>
                                <small class="text-muted">Mật khẩu có độ dài tối thiểu 6 ký tự</small>
                            </div>

                            <div class="d-flex justify-content-end" style="gap: 10px;">
                                <a th:href="${backUrl != null ? backUrl : '/user/list'}" class="btn btn-secondary px-3">
                                    <i class="fas fa-times mr-1"></i>Đóng
                                </a>
                                <button type="submit" class="btn btn-warning text-dark font-weight-bold px-4">
                                    <i class="fas fa-check-circle mr-1"></i>Cập nhật mật khẩu
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div th:insert="~{index.html :: footerAdmin}"></div>
    </div>
</div>
<!-- jQuery -->
<script th:src="@{/vendors/jquery/dist/jquery.min.js}"></script>
<!-- Bootstrap -->
<script th:src="@{/vendors/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script>
    $('#btnQuickDefaultPass').on('click', function () {
        $('#newPass').val('123456');
        $('#confirmPass').val('123456');
    });
    $('#togglePassBtn').on('click', function () {
        var isPass = $('#newPass').attr('type') === 'password';
        $('#newPass').attr('type', isPass ? 'text' : 'password');
        $('#confirmPass').attr('type', isPass ? 'text' : 'password');
        $('#togglePassIcon').toggleClass('fa-eye fa-eye-slash');
    });
    $('#editPassForm').on('submit', function (e) {
        var p1 = $('#newPass').val();
        var p2 = $('#confirmPass').val();
        if (!p1 || p1.trim().length < 6) {
            alert('Mật khẩu mới phải có ít nhất 6 ký tự.');
            e.preventDefault();
            return false;
        }
        if (p1.trim() !== p2.trim()) {
            alert('Mật khẩu xác nhận không trùng khớp.');
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
