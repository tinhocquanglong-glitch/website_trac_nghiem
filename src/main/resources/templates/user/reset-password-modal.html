<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<!-- Fragment Modal Cấp lại mật khẩu dùng chung cho Admin, Hiệu trưởng và GVCN -->
<div th:fragment="modal" class="modal fade" id="resetPasswordModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content" style="border-radius: 12px; overflow: hidden; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <form th:action="@{/user/reset-password}" method="post" id="resetPasswordModalForm">
                <input type="hidden" name="userId" id="resetModalUserId">
                <input type="hidden" name="returnUrl" id="resetModalReturnUrl">
                
                <div class="modal-header" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff;">
                    <h5 class="modal-title font-weight-bold" style="font-size: 1.1rem;">
                        <i class="fas fa-key mr-2"></i>Cấp lại mật khẩu
                    </h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close" style="opacity: 0.9;">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body p-4" style="background: #fafafa;">
                    <div class="p-3 mb-3" style="background: #fff; border: 1px solid #fed7aa; border-radius: 8px;">
                        <div class="d-flex align-items-center">
                            <div style="width: 42px; height: 42px; border-radius: 50%; background: #ffedd5; color: #d97706; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; margin-right: 12px;">
                                <i class="fas fa-user-shield"></i>
                            </div>
                            <div style="line-height: 1.35;">
                                <div class="text-muted small">Cấp lại mật khẩu cho:</div>
                                <div class="font-weight-bold text-dark" id="resetModalUserName" style="font-size: 1rem;">—</div>
                                <div class="text-muted small" id="resetModalUserMeta"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold small text-secondary">
                            Mật khẩu mới <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control" name="newPassword" id="modalNewPasswordInput"
                                   required minlength="6" placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)...">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary" type="button" id="btnToggleResetPassword" title="Hiện / Ẩn mật khẩu">
                                    <i class="fas fa-eye" id="iconToggleResetPassword"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="font-weight-bold small text-secondary">
                            Xác nhận mật khẩu mới <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" name="confirmPassword" id="modalConfirmPasswordInput"
                               required minlength="6" placeholder="Nhập lại mật khẩu mới...">
                    </div>

                    <div class="d-flex align-items-center justify-content-between pt-1">
                        <button type="button" class="btn btn-sm btn-outline-warning text-dark font-weight-bold" id="btnQuickFillPassword"
                                title="Điền nhanh mật khẩu mặc định 123456">
                            <i class="fas fa-magic mr-1 text-warning"></i>Đặt nhanh: <code>123456</code>
                        </button>
                        <small class="text-muted"><i class="fas fa-info-circle mr-1"></i>Tối thiểu 6 ký tự</small>
                    </div>
                </div>

                <div class="modal-footer bg-light" style="border-top: 1px solid #eee;">
                    <button type="button" class="btn btn-secondary btn-sm px-3" data-dismiss="modal">
                        <i class="fas fa-times mr-1"></i>Hủy
                    </button>
                    <button type="submit" class="btn btn-warning text-dark font-weight-bold btn-sm px-3">
                        <i class="fas fa-check-circle mr-1"></i>Xác nhận cấp lại
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof jQuery !== 'undefined') {
                var $modal = $('#resetPasswordModal');
                $modal.on('show.bs.modal', function (event) {
                    var button = $(event.relatedTarget);
                    if (!button.length) return;
                    var userId = button.data('user-id') || '';
                    var userName = button.data('user-name') || userId;
                    var userRole = button.data('user-role') || '';
                    var returnUrl = button.data('return-url') || window.location.href;

                    $modal.find('#resetModalUserId').val(userId);
                    $modal.find('#resetModalReturnUrl').val(returnUrl);
                    $modal.find('#resetModalUserName').text(userName);
                    $modal.find('#resetModalUserMeta').text('(@' + userId + (userRole ? ' · ' + userRole : '') + ')');
                    $modal.find('#modalNewPasswordInput').val('').attr('type', 'password');
                    $modal.find('#modalConfirmPasswordInput').val('').attr('type', 'password');
                    $modal.find('#iconToggleResetPassword').removeClass('fa-eye-slash').addClass('fa-eye');
                });

                $('#btnQuickFillPassword').on('click', function () {
                    $('#modalNewPasswordInput').val('123456');
                    $('#modalConfirmPasswordInput').val('123456');
                });

                $('#btnToggleResetPassword').on('click', function () {
                    var input1 = $('#modalNewPasswordInput');
                    var input2 = $('#modalConfirmPasswordInput');
                    var isPassword = input1.attr('type') === 'password';
                    input1.attr('type', isPassword ? 'text' : 'password');
                    input2.attr('type', isPassword ? 'text' : 'password');
                    $('#iconToggleResetPassword').toggleClass('fa-eye fa-eye-slash');
                });

                $('#resetPasswordModalForm').on('submit', function (e) {
                    var p1 = $('#modalNewPasswordInput').val();
                    var p2 = $('#modalConfirmPasswordInput').val();
                    if (!p1 || p1.trim().length < 6) {
                        alert('Mật khẩu mới phải có ít nhất 6 ký tự.');
                        e.preventDefault();
                        return false;
                    }
                    if (p1.trim() !== p2.trim()) {
                        alert('Mật khẩu xác nhận không trùng khớp.');
                        e.preventDefault();
                        return false;
                    }
                });
            }
        });
    </script>
</div>
</body>
</html>
