<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài liệu tham khảo</title>
</head>
<body>
<div class="container p-0">
    <div th:fragment="tai-lieu-tham-khao">
        <style>
            .doc-header-box {
                background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
                color: #ffffff;
                text-align: center;
                padding: 12px 16px;
                border-radius: 12px 12px 0 0;
                font-weight: 800;
                font-size: 0.95rem;
                letter-spacing: 0.5px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            }
            .doc-card-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-bottom: 1px solid #f1f5f9;
                text-decoration: none !important;
                color: inherit;
                transition: all 0.2s;
            }
            .doc-card-item:hover {
                background: #eef2ff;
                transform: translateX(3px);
            }
            .doc-icon-box {
                width: 42px;
                height: 42px;
                border-radius: 8px;
                background: #e0e7ff;
                color: #4338ca;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.2rem;
                flex-shrink: 0;
            }
        </style>

        <div class="doc-header-box">
            <i class="fas fa-book-reader" style="color: #c7d2fe;"></i>
            <span>TÀI LIỆU HỌC TẬP</span>
        </div>

        <div class="bg-white" style="border-radius: 0 0 12px 12px; border: 1px solid #e2e8f0; border-top: none;">
            <div th:if="${documents == null or documents.isEmpty()}" class="text-center py-4 text-muted small">
                <i class="fas fa-folder-open fa-2x mb-2 text-secondary d-block"></i>
                Chưa có tài liệu nào.
            </div>

            <div class="p-1">
                <a th:each="document : ${documents}" th:href="@{/tai-lieu/__${document.id}__}" class="doc-card-item">
                    <div class="doc-icon-box">
                        <i class="fas fa-file-pdf"></i>
                    </div>
                    <div class="flex-grow-1 text-truncate">
                        <div class="font-weight-bold text-dark text-truncate" style="font-size: 0.85rem;" th:text="${document.title}">Tên tài liệu</div>
                        <div class="text-muted text-truncate" style="font-size: 0.73rem; margin-top: 2px;">
                            <span><i class="fas fa-user-edit mr-1"></i><span th:text="${document.users != null ? document.users.fullName : 'Ban biên soạn'}">Tác giả</span></span>
                            <span class="mx-1">·</span>
                            <span><i class="far fa-eye mr-1"></i><span th:text="${document.view} + ' lượt'">0 lượt</span></span>
                        </div>
                    </div>
                </a>
            </div>

            <div th:if="${documents != null and !documents.isEmpty()}" class="p-2 text-center border-top">
                <a href="/tai-lieu" class="btn btn-sm btn-outline-primary btn-block" style="font-size: 0.8rem; font-weight: 600;">
                    <i class="fas fa-arrow-right mr-1"></i>Xem tất cả tài liệu
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
