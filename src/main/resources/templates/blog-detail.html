<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title th:text="${news.title} + ' - Chi tiết tin tức'">Chi tiết tin tức</title>
    <link rel="icon" href="/img/logo.png" type="image/x-icon">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.2.0 & FontAwesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/news.css}">
</head>
<body>

<!-- Header / Navigation -->
<div th:replace="~{default-page :: navbar}"></div>

<!-- ════════════════════ MAIN CONTAINER ════════════════════ -->
<main class="container-fluid px-lg-5 py-4 mb-5">
    <!-- Modern Breadcrumb -->
    <nav class="modern-breadcrumb" aria-label="breadcrumb">
        <a href="/"><i class="fa-solid fa-house me-1"></i>Trang chủ</a>
        <span class="separator">/</span>
        <a href="/tin-tuc">Tin tức giáo dục</a>
        <span class="separator">/</span>
        <span class="text-dark text-truncate d-inline-block" style="max-width: 350px;" th:text="${news.title}">Chi tiết bài viết</span>
    </nav>

    <div class="row g-4">
        <!-- Cột bài viết chính -->
        <div class="col-lg-8 col-xl-9">
            <article class="article-detail-card">
                <span class="badge bg-info-subtle text-info py-2 px-3 rounded-pill fw-bold mb-3 d-inline-flex align-items-center gap-1">
                    <i class="fa-solid fa-newspaper"></i> Bản tin học đường
                </span>
                
                <h1 class="article-title" th:text="${news.title}">Tiêu đề tin tức</h1>
                
                <div class="article-meta-bar">
                    <span>
                        <i class="fa-regular fa-calendar text-primary"></i>
                        <span th:text="${#dates.format(news.createDate, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
                    </span>
                    <span>
                        <i class="fa-regular fa-eye text-info"></i>
                        <span th:text="${news.view} + ' lượt xem'">0 lượt xem</span>
                    </span>
                    <span th:if="${news.users != null}">
                        <i class="fa-regular fa-user text-success"></i>
                        <span th:text="'Người đăng: ' + ${news.users.fullName}">Ban Biên Tập</span>
                    </span>
                </div>

                <!-- Nội dung tin tức -->
                <div class="article-content" th:utext="${news.content}">
                    Nội dung bài viết hiển thị tại đây...
                </div>
            </article>
        </div>

        <!-- Sidebar bên phải -->
        <div class="col-lg-4 col-xl-3">
            <div class="card border-0 shadow-sm rounded-4 p-4 mb-4" style="background: #ffffff; border: 1px solid var(--border-card) !important;">
                <h5 class="font-weight-bold mb-3 text-dark">
                    <i class="fa-solid fa-newspaper text-info me-2"></i>Bản tin học đường
                </h5>
                <p class="text-muted small mb-3">Đón đọc thêm các thông báo, quy chế và tin tức hoạt động mới nhất từ nhà trường.</p>
                <a href="/tin-tuc" class="btn btn-primary rounded-pill py-2 font-weight-bold w-100 mb-2">
                    <i class="fa-solid fa-arrow-left me-1"></i> Xem tất cả tin tức
                </a>
                <a href="/" class="btn btn-light rounded-pill py-2 font-weight-bold w-100 border">
                    <i class="fa-solid fa-house me-1"></i> Trang chủ
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{default-page :: footer}"></div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
