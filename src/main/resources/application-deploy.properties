server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL55Dialect
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# Production data is managed in Railway MySQL; never replace it at startup.
demo.seed.enabled=false
demo.seed.password=${DEMO_SEED_PASSWORD:Demo@123456}
demo.seed.admin.username=${DEMO_ADMIN_USERNAME:admin}
demo.seed.admin.password=${DEMO_ADMIN_PASSWORD:Demo@123456}
demo.reset.enabled=false
demo.reset.version=${DEMO_RESET_VERSION:2026-10-19-demo-v1}
demo.reset.confirm=${DEMO_RESET_CONFIRM:WIPE_DATABASE}
